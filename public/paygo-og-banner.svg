<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="paygo-grad-og" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="paygo-accent-og" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Glowing Radial Light behind Logo -->
  <circle cx="240" cy="315" r="220" fill="#2563eb" opacity="0.25" filter="url(#glow)" />
  <circle cx="950" cy="180" r="180" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />

  <!-- Subtle Grid Overlay -->
  <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200" stroke="#1e293b" stroke-width="1" opacity="0.4" />
  <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" stroke="#1e293b" stroke-width="1" opacity="0.4" />

  <!-- PayGo Large Emblem Tile -->
  <g transform="translate(120, 195) scale(3.818)">
    <rect width="44" height="44" rx="12" fill="url(#paygo-grad-og)" />
    <path
      d="M13 13C13 11.3431 14.3431 10 16 10H25.5C29.0899 10 32 12.9101 32 16.5C32 20.0899 29.0899 23 25.5 23H18.5V33C18.5 33.5523 18.0523 34 17.5 34H14C13.4477 34 13 33.5523 13 33V13Z"
      fill="white"
    />
    <path
      d="M19 15.5H25C26.3807 15.5 27.5 16.6193 27.5 18C27.5 19.3807 26.3807 20.5 25 20.5H19V15.5Z"
      fill="#1d4ed8"
    />
    <path
      d="M26 22L33 29H27L25 32L28 26H23L26 22Z"
      fill="url(#paygo-accent-og)"
    />
  </g>

  <!-- Typography & Copy -->
  <g transform="translate(340, 220)">
    <!-- Brand Name -->
    <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="54" letter-spacing="4" fill="#38bdf8">
      PAYGO <tspan fill="#ffffff">SECURE</tspan>
    </text>

    <!-- Main Tagline -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#f8fafc">
      HUMO &amp; UZCARD Avtomatlashtirilgan To‘lov Tizimi
    </text>

    <!-- Subtitle -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20" fill="#94a3b8">
      Telegram Userbot Monitoring, Webhook Avtomatizatsiya &amp; CRM Dashboard
    </text>

    <!-- Badges -->
    <g transform="translate(0, 185)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="210" height="42" rx="10" fill="#1e293b" stroke="#334155" />
      <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#38bdf8">⚡️ Instant Webhook</text>

      <!-- Badge 2 -->
      <rect x="225" y="0" width="220" height="42" rx="10" fill="#1e293b" stroke="#334155" />
      <text x="245" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#10b981">🤖 Userbot Monitoring</text>

      <!-- Badge 3 -->
      <rect x="460" y="0" width="200" height="42" rx="10" fill="#1e293b" stroke="#334155" />
      <text x="480" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#a855f7">🛡 100% Xavfsiz CRM</text>
    </g>
  </g>

  <!-- Footer Border -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#paygo-grad-og)" />
</svg>
